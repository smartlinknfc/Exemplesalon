<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ÉLÉGANCE — Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"DM Sans",sans-serif;background:#faf5f2;color:#382d2b}button,input,select{font:inherit}
.hidden{display:none!important}.login-page{min-height:100vh;display:grid;place-items:center;padding:25px;background:linear-gradient(135deg,#fffaf8,#f4dfdc)}
.login-card{width:min(430px,100%);background:#fff;padding:42px;border-radius:14px;box-shadow:0 25px 70px #3c28281f}.brand{text-align:center;margin-bottom:30px}
.brand h1{font:600 32px "Playfair Display";letter-spacing:5px}.brand p,.topbar span{font-size:10px;letter-spacing:4px;color:#c97d7e}
.login-card label{display:block;font-size:11px;font-weight:700;margin:17px 0 8px}.login-card input{width:100%;height:48px;border:1px solid #e4d9d5;border-radius:5px;padding:0 14px;outline:0}
.primary,.refresh{border:0;border-radius:5px;background:#c97d7e;color:#fff;font-weight:700;cursor:pointer}.primary{width:100%;height:50px;letter-spacing:1px;margin-top:22px}
.error{margin-top:14px;color:#a94442;background:#fbeaea;padding:12px;border-radius:5px;font-size:12px}
.topbar{height:78px;background:#fff;border-bottom:1px solid #eadfdb;display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:5}
.topbar h1{font:600 24px "Playfair Display";letter-spacing:2px}.logout{border:1px solid #e1d4d0;background:#fff;border-radius:5px;padding:10px 16px;cursor:pointer}
.container{width:min(1200px,92%);margin:32px auto}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:22px}
.toolbar-left{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.filter,.date-input{height:44px;border:1px solid #dfd2ce;border-radius:5px;background:#fff;padding:0 12px}.refresh{height:44px;padding:0 18px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:25px}.stat{background:#fff;border:1px solid #eadfdb;border-radius:8px;padding:19px}.stat b{display:block;font:600 29px "Playfair Display"}.stat small{color:#817773;font-size:11px}
.section-title{font:600 24px "Playfair Display";margin:25px 0 14px}.calendar{background:#fff;border:1px solid #eadfdb;border-radius:10px;padding:18px;overflow:auto}
.week{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;min-width:900px}.day{border:1px solid #eee2de;border-radius:8px;min-height:150px;overflow:hidden}.day-head{padding:11px;background:#faf5f2;border-bottom:1px solid #eee2de}.day-head small{display:block;color:#897a75;font-size:10px;text-transform:uppercase}.day-head strong{font-size:14px}.day.today .day-head{background:#f3dedd}.day-list{padding:8px}.event{padding:8px;margin-bottom:7px;border-radius:6px;background:#f8ecea;border-left:3px solid #c97d7e;font-size:10px}.event strong{display:block;font-size:11px}.event span{color:#6f625e}.no-event{font-size:10px;color:#b1a5a0;padding:8px}
.staff-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.staff{background:#fff;border:1px solid #eadfdb;border-radius:10px;padding:18px}.staff-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.staff-head h3{font:600 20px "Playfair Display"}.badge{background:#f4e2df;color:#a86466;padding:5px 8px;border-radius:20px;font-size:10px}.staff-event{padding:11px;border:1px solid #eee2de;border-radius:7px;margin-bottom:8px}.staff-event b{font-size:12px}.staff-event small{display:block;color:#7b6e69;margin-top:3px}.table-wrap{background:#fff;border:1px solid #eadfdb;border-radius:8px;overflow:auto;margin-top:25px}table{width:100%;border-collapse:collapse;min-width:900px}
th,td{text-align:left;padding:14px;border-bottom:1px solid #eee5e1;font-size:12px}th{background:#faf5f2;font-size:10px;letter-spacing:1px}.status{display:inline-block;padding:6px 9px;border-radius:20px;font-size:10px;font-weight:700}.pending{background:#fff1d8;color:#986b17}.confirmed{background:#e5f5e9;color:#28743d}.cancelled{background:#f8e2e2;color:#a33e3e}
.actions{display:flex;gap:6px}.action{border:0;border-radius:4px;padding:8px 10px;font-size:10px;cursor:pointer}.confirm{background:#e5f5e9;color:#28743d}.cancel{background:#f8e2e2;color:#a33e3e}.empty{text-align:center;padding:40px;color:#817773}
@media(max-width:800px){.cards,.staff-grid{grid-template-columns:1fr 1fr}.container{width:94%}}@media(max-width:520px){.cards,.staff-grid{grid-template-columns:1fr}.topbar h1{font-size:18px}}
</style>
</head>
<body>
<div id="loginPage" class="login-page"><div class="login-card">
<div class="brand"><h1>ÉLÉGANCE</h1><p>ADMINISTRATION</p></div>
<form id="loginForm"><label>EMAIL</label><input id="email" type="email" autocomplete="username" required>
<label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" required>
<button id="loginBtn" class="primary">LOGIN</button><div id="loginError" class="error hidden"></div></form>
</div></div>

<div id="dashboard" class="hidden">
<header class="topbar"><div><h1>ÉLÉGANCE</h1><span>ADMIN DASHBOARD</span></div><button id="logoutBtn" class="logout">Logout</button></header>
<main class="container">
<div class="toolbar"><div class="toolbar-left">
<select id="dateMode" class="filter"><option value="all">All dates</option><option value="today">Today</option><option value="week">This week</option><option value="specific">Specific date</option></select>
<input id="dateFilter" class="date-input hidden" type="date">
<select id="statusFilter" class="filter"><option value="all">All statuses</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="cancelled">Cancelled</option></select>
</div><button id="refreshBtn" class="refresh">↻ Refresh</button></div>

<section class="cards">
<div class="stat"><b id="totalCount">0</b><small>Total appointments</small></div><div class="stat"><b id="pendingCount">0</b><small>Pending</small></div>
<div class="stat"><b id="confirmedCount">0</b><small>Confirmed</small></div><div class="stat"><b id="todayCount">0</b><small>Today</small></div>
</section>

<h2 class="section-title">Weekly Calendar</h2>
<section class="calendar"><div id="week" class="week"></div></section>

<h2 class="section-title">Staff Schedule · By Service</h2>
<section id="staffGrid" class="staff-grid"></section>

<section class="table-wrap"><table><thead><tr><th>DATE</th><th>TIME</th><th>CLIENT</th><th>PHONE</th><th>SERVICE</th><th>STAFF</th><th>STATUS</th><th>ACTIONS</th></tr></thead>
<tbody id="appointmentsBody"></tbody></table><div id="empty" class="empty hidden">No appointments found.</div></section>
</main></div>

<script>
const SUPABASE_URL="https://rrxtxulmuojyxhomnhbj.supabase.co";
const SUPABASE_KEY="sb_publishable_2xZkfkOKCkKe6mS_n0b4YQ_lzCh-2NJ";
const $=id=>document.getElementById(id);
let allRows=[];

function todayLocal(){const d=new Date(),x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}
function session(){return JSON.parse(localStorage.getItem("elegance_admin_session")||"null")}
function headers(){const s=session();return {"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":`Bearer ${s.access_token}`}}
function addDays(ds,n){const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function monday(ds){const d=new Date(ds+"T12:00:00"),day=d.getDay();d.setDate(d.getDate()+(day===0?-6:1-day));return d.toISOString().slice(0,10)}
function fmt(ds){return new Date(ds+"T12:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short"})}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

async function login(email,password){
 const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},body:JSON.stringify({email,password})});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.msg||d.message||d.error_description||"Login failed");
 localStorage.setItem("elegance_admin_session",JSON.stringify(d));showDashboard();
}
function showLogin(){$("dashboard").classList.add("hidden");$("loginPage").classList.remove("hidden")}
function showDashboard(){if(!session()?.access_token)return showLogin();$("loginPage").classList.add("hidden");$("dashboard").classList.remove("hidden");load()}

function queryForFilter(){
 let u=`${SUPABASE_URL}/rest/v1/appointments?select=id,customer_name,phone,service,appointment_date,appointment_time,status,staff_member&order=appointment_date.asc,appointment_time.asc`;
 const mode=$("dateMode").value,st=$("statusFilter").value;
 if(mode==="today")u+=`&appointment_date=eq.${todayLocal()}`;
 if(mode==="specific"&&$("dateFilter").value)u+=`&appointment_date=eq.${$("dateFilter").value}`;
 if(mode==="week"){const m=monday(todayLocal());u+=`&appointment_date=gte.${m}&appointment_date=lte.${addDays(m,6)}`}
 if(st!=="all")u+=`&status=eq.${st}`;
 return u;
}
async function load(){
 try{
  const r=await fetch(queryForFilter(),{headers:headers()});const d=await r.json().catch(()=>[]);
  if(r.status===401){localStorage.removeItem("elegance_admin_session");showLogin();throw Error("Session expired. Please log in again.")}
  if(!r.ok)throw Error(d.message||d.hint||"Could not load appointments.");
  allRows=d;renderTable(d);renderCalendar(d);renderStaff(d);stats();
 }catch(e){$("appointmentsBody").innerHTML=`<tr><td colspan="8" style="color:#a33e3e;padding:25px">${esc(e.message)}</td></tr>`}
}
function staffOptions(service, current){
 const map={
  "Hair Styling":["A1","A2","A3"],
  "Nail Care":["B1","B2","B3"],
  "Makeup":["C1","C2","C3"],
  "Facial Treatment":["D1","D2","D3"]
 };
 return (map[service]||[]).map(s=>`<option value="${s}" ${s===current?"selected":""}>${s}</option>`).join("");
}
function renderTable(rows){
 $("appointmentsBody").innerHTML="";
 $("empty").classList.toggle("hidden",!!rows.length);
 rows.forEach(a=>{
  const st=(a.status||"pending").toLowerCase();
  const tr=document.createElement("tr");
  tr.innerHTML=`
   <td>${esc(a.appointment_date||"")}</td>
   <td>${esc((a.appointment_time||"").slice(0,5))}</td>
   <td><strong>${esc(a.customer_name||"")}</strong></td>
   <td>${esc(a.phone||"")}</td>
   <td>${esc(a.service||"")}</td>
   <td>
     <select class="filter" style="height:34px;padding:0 8px"
       onchange="changeStaff(${a.id}, this.value, '${esc(a.service||"")}')">
       ${staffOptions(a.service,a.staff_member)}
     </select>
   </td>
   <td><span class="status ${st}">${esc(st)}</span></td>
   <td class="actions">
    ${st!=="confirmed"&&st!=="cancelled"?`<button class="action confirm" onclick="updateStatus(${a.id},'confirmed')">Confirm</button>`:""}
    ${st!=="cancelled"?`<button class="action cancel" onclick="updateStatus(${a.id},'cancelled')">Cancel</button>`:""}
   </td>`;
  $("appointmentsBody").appendChild(tr);
 });
}
async function changeStaff(id, staff, service){
 try{
  const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/change_appointment_staff`,{
   method:"POST",
   headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":`Bearer ${session().access_token}`},
   body:JSON.stringify({p_appointment_id:id,p_new_staff:staff})
  });
  const text=await r.text();
  if(!r.ok){
   let msg=text;try{const d=JSON.parse(text);msg=d.message||d.error||text}catch(e){}
   throw Error(msg||"Could not change staff.");
  }
  alert(`Staff changed successfully → ${staff}`);
  load();
 }catch(e){
  alert(e.message);
  load();
 }
}
function formatCalendarDate(d){
  return d.toISOString().slice(0,10);
}

function renderCalendar(rows){
  const view = $("calendarView")?.value || "weekly";
  const customDate = $("calendarDate")?.value || "";

  let baseDate = new Date();
  if(view === "custom" && customDate){
    baseDate = new Date(customDate + "T12:00:00");
  }

  let dates = [];

  if(view === "today"){
    dates = [baseDate];
  } else if(view === "custom"){
    dates = [baseDate];
  } else {
    // Current week: Monday -> Sunday
    const day = baseDate.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    const monday = new Date(baseDate);
    monday.setDate(baseDate.getDate() + diff);
    monday.setHours(12,0,0,0);

    for(let i=0;i<7;i++){
      const d = new Date(monday);
      d.setDate(monday.getDate()+i);
      dates.push(d);
    }
  }

  const container = $("calendarGrid");
  if(!container) return;

  container.innerHTML = "";

  dates.forEach(d=>{
    const dateKey = formatCalendarDate(d);
    const dayRows = rows
      .filter(a => a.appointment_date === dateKey)
      .sort((a,b)=>(a.appointment_time||"").localeCompare(b.appointment_time||""));

    const col = document.createElement("div");
    col.className = "calendar-day";

    const dayName = d.toLocaleDateString("en-US",{weekday:"short"}).toUpperCase();
    const dayLabel = d.toLocaleDateString("en-US",{day:"2-digit",month:"short"});

    col.innerHTML = `
      <div class="calendar-day-head">
        <span>${dayName}</span>
        <strong>${dayLabel}</strong>
      </div>
      <div class="calendar-day-body">
        ${dayRows.length
          ? dayRows.map(a=>`
            <div class="calendar-item">
              <strong>${esc((a.appointment_time||"").slice(0,5))} · ${esc(a.service||"")}</strong>
              <small>${esc(a.customer_name||"")} · ${esc(a.staff_member||"")}</small>
            </div>
          `).join("")
          : `<div class="no-appointments">No appointments</div>`
        }
      </div>
    `;

    container.appendChild(col);
  });

  // Update heading according to the selected view.
  const heading = document.querySelector("h2");
  if(heading && heading.textContent.trim() === "Weekly Calendar"){
    heading.textContent =
      view === "today" ? "Today"
      : view === "custom" ? "Selected Day"
      : "Weekly Calendar";
  }
}

function setupCalendarControls(){
  const view = $("calendarView");
  const date = $("calendarDate");
  if(!view || !date) return;

  const update = ()=>{
    date.style.display = view.value === "custom" ? "block" : "none";
    if(view.value === "custom" && !date.value){
      date.value = new Date().toISOString().slice(0,10);
    }
    load();
  };

  view.addEventListener("change", update);
  date.addEventListener("change", ()=>load());
}

function renderStaff(rows){
 const serviceStaff={
  "Hair Styling":["A1","A2","A3"],
  "Nail Care":["B1","B2","B3"],
  "Makeup":["C1","C2","C3"],
  "Facial Treatment":["D1","D2","D3"]
 };
 const groups={};
 Object.keys(serviceStaff).forEach(s=>groups[s]=[]);
 rows.forEach((a)=>{
   const service=a.service||"";
   if(groups[service]) groups[service].push(a);
 });
 const grid=$("staffGrid");grid.innerHTML="";
 Object.entries(serviceStaff).forEach(([service,names])=>{
   const serviceRows=groups[service]||[];
   const section=document.createElement("div");
   section.style.gridColumn="1 / -1";
   section.innerHTML=`<h3 style="font:600 24px 'Playfair Display';margin:8px 0 10px">${esc(service)}</h3>`;
   const row=document.createElement("div");row.className="staff-grid";
   names.forEach((name,i)=>{
     const mine=serviceRows.filter(a=>a.staff_member===name);
     const box=document.createElement("div");box.className="staff";
     box.innerHTML=`<div class="staff-head"><h3>${name}</h3><span class="badge">${mine.length} appointments</span></div>
     ${mine.length?mine.map(a=>`<div class="staff-event"><b>${esc((a.appointment_time||"").slice(0,5))} · ${esc(a.customer_name||"")}</b><small>${esc(service)} · ${esc(a.appointment_date||"")}</small></div>`).join(""):'<div class="no-event">No appointments</div>'}`;
     row.appendChild(box);
   });
   section.appendChild(row);grid.appendChild(section);
 });
}
async function stats(){
 async function c(extra=""){const r=await fetch(`${SUPABASE_URL}/rest/v1/appointments?select=id${extra}`,{headers:{...headers(),"Prefer":"count=exact"}});const cr=r.headers.get("content-range");if(cr&&cr.includes("/"))return Number(cr.split("/")[1]);const d=await r.json().catch(()=>[]);return d.length}
 $("totalCount").textContent=await c();$("pendingCount").textContent=await c("&status=eq.pending");$("confirmedCount").textContent=await c("&status=eq.confirmed");$("todayCount").textContent=await c(`&appointment_date=eq.${todayLocal()}`);
}
async function updateStatus(id,status){
 if(!confirm(`Set this appointment to ${status}?`))return;
 const r=await fetch(`${SUPABASE_URL}/rest/v1/appointments?id=eq.${id}`,{method:"PATCH",headers:{...headers(),"Prefer":"return=minimal"},body:JSON.stringify({status})});
 if(!r.ok){const d=await r.json().catch(()=>({}));alert(d.message||"Could not update appointment.");return}load();
}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginBtn").disabled=true;try{await login($("email").value.trim(),$("password").value)}catch(x){$("loginError").textContent=x.message;$("loginError").classList.remove("hidden")}finally{$("loginBtn").disabled=false}};
$("logoutBtn").onclick=async()=>{localStorage.removeItem("elegance_admin_session");showLogin()};
$("refreshBtn").onclick=load;$("statusFilter").onchange=load;
$("dateMode").onchange=()=>{$("dateFilter").classList.toggle("hidden",$("dateMode").value!=="specific");if($("dateMode").value==="specific"&&!$("dateFilter").value)$("dateFilter").value=todayLocal();load()};
$("dateFilter").onchange=load;showDashboard();

setupCalendarControls();
</script>
</body>
</html>
